[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-scraper"
version = "0.1.0"
description = "Cached netkeiba race data collector for personal analysis"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4==4.14.3", "requests==2.32.5"]

[project.scripts]
keiba-scraper = "keiba_scraper.cli:main"
keiba-ai = "keiba_ai.cli:main"
keiba-app = "keiba_app.__main__:main"

[project.optional-dependencies]
ml = ["numpy==2.3.5", "scipy==1.16.3", "scikit-learn==1.7.2", "joblib==1.5.2", "threadpoolctl==3.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keiba_app = ["static/*"]
